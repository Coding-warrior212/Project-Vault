<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectVault — AI-Powered Project Continuity & Handover</title>
    <meta name="description" content="Knowledge that stays. Projects that move. Connect project sources, reconstruct institutional knowledge, verify evidence, review claims, and generate reliable project handovers." />
    <meta property="og:title" content="ProjectVault — AI-Powered Project Continuity & Handover" />
    <meta property="og:description" content="Knowledge that stays. Projects that move. Connect project sources, reconstruct institutional knowledge, verify evidence, review claims, and generate reliable project handovers." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('projectvault_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-50 dark:bg-[#111033] text-neutral-900 dark:text-[#FFF4E3] antialiased font-sans selection:bg-[#F36B3F]/20 selection:text-[#25245F] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
